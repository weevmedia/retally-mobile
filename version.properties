# App version: the single source of truth for both platforms.
#   versionName  marketing version shown in the app and compared with config/appVersion
#                (plain semver, no suffixes). Bump for every release.
#   versionCode  integer the stores order builds by (Android versionCode / iOS
#                CURRENT_PROJECT_VERSION). Must increase on every upload, even a re-upload
#                of the same versionName. CI may override: -Pretally.versionCode=<n>.
# After editing run `./gradlew syncIosVersion` (also runs before every Android build) so
# iosApp/Version.xcconfig matches.
versionName=1.0.0
versionCode=2
